<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("bp-data").textContent);
  const N = DATA.nodes;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  let current = null, coneOn = false, gv = null, showingFull = false;

  const UI = DATA.ui;
  $("#doc_sub").textContent = [DATA.authors, DATA.order.length + " " + UI.results].filter(Boolean).join(" · ");
  if (!DATA.dot_full) $("#edges-toggle").style.display = "none";

  // ---- search ------------------------------------------------------------
  const dl = $("#search-list"), searchIndex = {};
  DATA.order.forEach((id) => {
    const n = N[id];
    const text = n.label + (n.title_plain ? " — " + n.title_plain : "");
    searchIndex[text.toLowerCase()] = id; searchIndex[id.toLowerCase()] = id;
    const o = document.createElement("option"); o.value = text; dl.appendChild(o);
  });
  function doSearch() {
    const q = $("#search").value.trim().toLowerCase();
    if (!q) return;
    let id = searchIndex[q];
    if (!id) {
      const hit = Object.keys(searchIndex).find((k) => k.includes(q));
      id = hit && searchIndex[hit];
    }
    if (id) openNode(id, true);
  }
  $("#search").addEventListener("change", doSearch);
  $("#search").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });

  // ---- legend --------------------------------------------------------------
  $("#legend_title").addEventListener("click", () => {
    const d = $("#Legend dl"); d.style.display = d.style.display === "block" ? "none" : "block";
  });

  // ---- graph ---------------------------------------------------------------
  function render(dot) {
    const box = $("#graph").getBoundingClientRect();
    gv = d3.select("#graph").graphviz({useWorker: false, fit: true, zoomScaleExtent: [0.03, 12]})
      .width(box.width).height(box.height).fit(true)
      .renderDot(dot)
      .on("end", interactive);
  }
  function nodeSel(id) {
    return d3.selectAll("#graph .node").filter(function () { return d3.select(this).select("title").text().trim() === id; });
  }
  function interactive() {
    $("#loading").style.display = "none";
    const tip = $("#tooltip");
    d3.selectAll("#graph .node")
      .attr("pointer-events", "fill")
      .on("click", function (ev) {
        ev.stopPropagation();
        openNode(d3.select(this).select("title").text().trim(), false);
      })
      .on("mousemove", function (ev) {
        const id = d3.select(this).select("title").text().trim(), n = N[id];
        if (!n) return;
        tip.innerHTML = "<b>" + esc(n.label + (n.title_plain ? " (" + n.title_plain + ")" : "")) + "</b>" +
          (n.importance != null ? UI.importance + " " + n.importance + "/5" : UI.not_rated) +
          (n.summary_plain ? "<br>" + esc(n.summary_plain) : "");
        tip.style.display = "block";
        const x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
        tip.style.left = x + "px"; tip.style.top = (ev.clientY + 14) + "px";
      })
      .on("mouseleave", () => { tip.style.display = "none"; });
    d3.selectAll("#graph .edge").each(function () {
      const t = d3.select(this).select("title").text().split("->");
      this.dataset.src = t[0]; this.dataset.dst = t[1];
    });
    d3.select("#graph svg").on("click", (ev) => { if (ev.target.closest(".node") == null) closeModal(); });
    if (current) highlight(current);
    const h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (!current && h && N[h]) openNode(h, true);
  }
  $("#fit").addEventListener("click", () => { if (gv) gv.resetZoom(d3.transition().duration(400)); });
  $("#all-edges").addEventListener("change", (e) => {
    showingFull = e.target.checked;
    render(showingFull ? DATA.dot_full : DATA.dot);
  });

  function highlight(id) {
    d3.selectAll("#graph .node").classed("bp-selected", function () { return d3.select(this).select("title").text().trim() === id; });
    d3.selectAll("#graph .edge")
      .classed("bp-in", function () { return this.dataset.dst === id; })
      .classed("bp-out", function () { return this.dataset.src === id; });
    applyCone();
  }
  function applyCone() {
    if (!coneOn || !current) {
      d3.selectAll("#graph .node, #graph .edge").classed("bp-dim", false);
      return;
    }
    const n = N[current], keep = new Set([current].concat(n.ancestors, n.descendants));
    d3.selectAll("#graph .node").classed("bp-dim", function () { return !keep.has(d3.select(this).select("title").text().trim()); });
    d3.selectAll("#graph .edge").classed("bp-dim", function () { return !(keep.has(this.dataset.src) && keep.has(this.dataset.dst)); });
  }
  function panTo(id) {
    const sel = nodeSel(id);
    if (sel.empty() || !gv) return;
    const r = sel.node().getBoundingClientRect(), c = $("#graph").getBoundingClientRect();
    const svg = d3.select("#graph svg"), k = d3.zoomTransform(svg.node()).k || 1;
    const modalW = $("#modal").style.display === "block" && window.innerWidth > 640 ? $("#modal").offsetWidth : 0;
    const cx = c.left + (c.width - modalW) / 2, cy = c.top + c.height / 2;
    const dx = cx - (r.left + r.width / 2), dy = cy - (r.top + r.height / 2);
    gv.zoomSelection().transition().duration(500).call(gv.zoomBehavior().translateBy, dx / k, dy / k);
  }

  // ---- modal -----------------------------------------------------------------
  function chip(id, part) {
    const n = N[id]; if (!n) return "";
    return '<span class="chip ' + part + '" data-node="' + esc(id) + '" style="background:' + n.fill + ";color:" + n.font +
      '" title="' + esc((part === "statement" ? UI.used_stmt : UI.used_proof) + (n.title_plain ? " — " + n.title_plain : "")) + '">' +
      esc(n.label) + "</span>";
  }
  function meter(v) {
    let s = '<span class="meter">';
    for (let i = 1; i <= 5; i++) s += '<span style="background:' + (v != null && i <= Math.round(v) ? DATA.palette[i - 1] : "#fff") + '"></span>';
    return s + "</span>";
  }
  function openNode(id, pan) {
    const n = N[id]; if (!n) return;
    current = id;
    history.replaceState(null, "", "#" + encodeURIComponent(id));
    const body = $("#modal-body");
    if (window.MathJax && MathJax.typesetClear) MathJax.typesetClear([body]);
    const lvl = n.importance != null ? Math.round(n.importance) : null;
    const lvlName = n.importance == null ? "" : (Number.isInteger(n.importance) ? (DATA.levels[n.importance] || "")
      : (DATA.levels[Math.floor(n.importance)] || "") + " – " + (DATA.levels[Math.ceil(n.importance)] || ""));
    let h = '<div class="thm_thmheading"><span class="thm_thmcaption">' + esc(n.display) + "</span>" +
      (n.number ? '<span class="thm_thmlabel">' + esc(n.number) + "</span>" : "") +
      (n.title ? '<span class="thm_thmtitle">' + n.title + "</span>" : "") + "</div>";
    h += '<div class="thm_meta"><code>' + esc(id) + "</code>" +
      (n.section ? " · §" + esc(n.section) + (n.section_title ? " " + esc(n.section_title) : "") : "") +
      (n.loc ? " · " + esc(n.loc) : "") + (n.main ? " · <b>" + esc(UI.main) + "</b>" : "") + "</div>";
    if (n.context) h += '<div class="context"><div class="hd">' + esc(UI.context) + "</div>" + n.context + "</div>";
    h += '<div class="thm_thmcontent kind-' + esc(n.kind) + '">' + (n.statement || '<span class="none">' + esc(UI.no_statement) + '</span>') + "</div>";
    if (n.notation && n.notation.length) h += '<details class="proof notation-here"><summary>' + esc(UI.notation_here) +
      " (" + n.notation.length + ")</summary><div>" + n.notation.map((k) => notationRow(DATA.notation[k])).join("") + "</div></details>";
    h += '<div class="importance">' + meter(n.importance) + "<span>" +
      (lvl != null ? "<b>" + esc(UI.importance) + " " + n.importance + "/5</b> · " + esc(lvlName) : "<i>" + esc(UI.not_rated) + "</i>") + "</span></div>";
    if (n.reason) h += '<div class="block"><div class="hd">' + esc(UI.why) + '</div>' + n.reason + "</div>";
    if (n.summary) h += '<div class="block"><div class="hd">' + esc(UI.role) + '</div>' + n.summary + "</div>";
    if (n.proof_sketch) h += '<details class="proof" open><summary>' + esc(UI.sketch) + '</summary><div>' + n.proof_sketch + "</div></details>";
    if (n.proof) h += '<details class="proof"' + (n.proof_sketch ? "" : "") + "><summary>" + (n.proof_raw ? UI.proof_pdf : UI.proof) + "</summary><div>" + n.proof + "</div></details>";
    h += '<div class="block"><div class="hd">' + esc(UI.uses) + '</div>' + (n.uses.length ? '<div class="chips">' + n.uses.map((u) => chip(u[0], u[1])).join("") + "</div>" : '<span class="none">' + esc(UI.nothing) + '</span>') + "</div>";
    h += '<div class="block"><div class="hd">' + esc(UI.used_by) + '</div>' + (n.used_by.length ? '<div class="chips">' + n.used_by.map((u) => chip(u[0], u[1])).join("") + "</div>" : '<span class="none">' + esc(UI.nothing) + '</span>') + "</div>";
    h += '<div class="modal-actions"><button id="cone-btn" class="' + (coneOn ? "on" : "") + '">' + esc(coneOn ? UI.cone_on : UI.cone) + " (" +
      n.ancestors.length + " " + esc(UI.up) + ", " + n.descendants.length + " " + esc(UI.down) + ')</button><button id="center-btn">' + esc(UI.centre) + '</button></div>';
    body.innerHTML = h;
    $("#modal").style.display = "block";
    body.parentNode.scrollTop = 0;
    highlight(id);
    if (pan) panTo(id);
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([body]).catch((e) => console.warn(e));
    $("#cone-btn").addEventListener("click", () => { coneOn = !coneOn; openNode(id, false); });
    $("#center-btn").addEventListener("click", () => panTo(id));
  }
  function notationRow(e) {
    return '<div class="nrow"><span class="nsym">' + e.symbol + '</span><span class="nmean">' + e.meaning +
      (e.where ? ' <span class="nwhere">(' + e.where + ")</span>" : "") + "</span></div>";
  }
  function openGlossary() {
    current = null;
    const body = $("#modal-body");
    if (window.MathJax && MathJax.typesetClear) MathJax.typesetClear([body]);
    body.innerHTML = '<div class="thm_thmheading">' + esc(UI.glossary) + "</div>" +
      (DATA.notation.length ? '<div class="block glossary">' + DATA.notation.map(notationRow).join("") + "</div>"
                            : '<span class="none">' + esc(UI.glossary_empty) + "</span>");
    $("#modal").style.display = "block";
    highlight(null);
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([body]).catch((e) => console.warn(e));
  }
  $("#glossary-btn").addEventListener("click", openGlossary);
  if (!DATA.notation.length) $("#glossary-btn").style.display = "none";
  else $("#glossary-count").textContent = DATA.notation.length;
  function closeModal() {
    $("#modal").style.display = "none";
    current = null; coneOn = false;
    history.replaceState(null, "", location.pathname + location.search);
    highlight(null);
  }
  $(".dep-closebtn").addEventListener("click", closeModal);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
  $("#modal-body").addEventListener("click", (e) => {
    const t = e.target.closest("[data-node]");
    if (t) { e.preventDefault(); openNode(t.dataset.node, true); }
  });
  let rt = null;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (gv) { const b = $("#graph").getBoundingClientRect(); gv.width(b.width).height(b.height).fit(true).render(); } }, 250);
  });
  render(DATA.dot);
})();
</script>
